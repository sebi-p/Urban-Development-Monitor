[project]
name = "mdu-pipeline"
version = "0.0.0"
description = "Collection and document-processing pipeline for Monitor Dezvoltare Urbană"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
mdu = "mdu.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mdu"

[tool.uv]
# Supply-chain safety: ignore releases newer than 14 days (matches pnpm minimumReleaseAge).
exclude-newer = "2 weeks"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PL", "PT"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mdu"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra"]
