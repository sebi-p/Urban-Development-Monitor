[project]
name = "mdu-pipeline"
version = "0.0.0"
description = "Collection and document-processing pipeline for Monitor Dezvoltare Urbană"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.6.0",
    "boto3>=1.43.125",
    "httpx[http2]>=0.28.1",
    "mapbox-vector-tile>=2.2.0",
    "psycopg[binary]>=3.3.8",
    "pymupdf>=1.28.2,<2",
    "pypdf>=7.0.0",
    "pyproj>=3.8.0",
    "pyyaml>=6.0.3",
    "selectolax>=1.0.2",
]

[project.scripts]
mdu = "mdu.cli:main"

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.43.125",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "types-pyyaml>=6.0.12.20261103",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mdu"

[tool.uv]
# Supply-chain safety: ignore releases newer than 14 days (matches pnpm minimumReleaseAge).
exclude-newer = "2 weeks"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Romanian text and year ranges use the en dash legitimately.
allowed-confusables = ["–"]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PL", "PT"]

[tool.ruff.lint.per-file-ignores]
# Literal status codes and counts are the clearest assertions in tests.
"tests/**" = ["PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mdu"]
mypy_path = "src"

[[tool.mypy.overrides]]
# Ships without type information.
module = "mapbox_vector_tile.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# PyMuPDF's inline annotations are partial (untyped constructors and helpers).
module = "mdu.core.extract"
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra"]
# PyMuPDF's SWIG bindings warn on import under Python 3.12.
filterwarnings = ["ignore:builtin type (SwigPy|swigvarlink).*:DeprecationWarning"]
