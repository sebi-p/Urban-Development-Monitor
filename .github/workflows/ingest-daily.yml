name: Ingest daily

# PLAN §7: debates, notices, agendas and the urbanism hub every morning, then fetch, extract and
# classify.
# Vercel Cron starts it between 04:00 and 04:59 UTC through /api/start/daily (ADR 0021). GitHub's
# own schedule stays as a backup: it has started runs 8 to 10 hours late, and a second run in a
# day changes nothing.
on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write # the failure alert (M5.4)

concurrency:
  # Shared with the nightly back-fill: one job at a time talks to the city's site, and a run
  # that would overlap waits (never stop a run halfway).
  group: brasovcity-requests
  cancel-in-progress: false

jobs:
  daily:
    name: Daily ingest (Brașov)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: pipeline
    env:
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      # Classifier LLM fallback (ADR 0008); without the secret the classifier uses rules only.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MDU_LLM_MONTHLY_USD: "5"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3; no moving major tag
        with:
          working-directory: pipeline
          enable-cache: true
      - name: Install Tesseract with Romanian data (ADR 0006)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-ron
      - run: uv sync --locked --no-dev
      - run: uv run --no-dev mdu daily --city brasov
      - uses: actions/setup-node@v7
        if: failure() || cancelled()
        with:
          node-version-file: .nvmrc
      - name: Alert (GitHub issue)
        if: failure() || cancelled()
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALERT_SOURCE: "the ingest-daily workflow"
        run: |
          node apps/web/scripts/alert.ts "brasov:daily" "brasov: the daily run failed" "The run failed or timed out: $RUN_URL"
