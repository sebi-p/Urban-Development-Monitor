name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (TypeScript)
    runs-on: ubuntu-latest
    services:
      postgis:
        image: imresamu/postgis:18-3.6 # same image as docker-compose.yml
        env:
          POSTGRES_USER: mdu
          POSTGRES_PASSWORD: mdu
          POSTGRES_DB: mdu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mdu" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      # packages/db integration tests create and drop a throwaway database here.
      TEST_DATABASE_URL: postgres://mdu:mdu@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from packageManager in package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: Migrations match the schema
        run: |
          pnpm db:generate
          git status --porcelain packages/db/migrations
          test -z "$(git status --porcelain packages/db/migrations)"
      - run: pnpm test
      - run: pnpm build

  pipeline:
    name: Pipeline (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3; no moving major tag
        with:
          working-directory: pipeline
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
