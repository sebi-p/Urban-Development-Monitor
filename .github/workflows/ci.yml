name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Pushes to main queue instead of cancelling each other, so the migrate job is never stopped
  # halfway. Pull requests still cancel superseded runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Web (TypeScript)
    runs-on: ubuntu-latest
    services:
      postgis:
        image: imresamu/postgis:18-3.6 # same image as docker-compose.yml
        env:
          POSTGRES_USER: mdu
          POSTGRES_PASSWORD: mdu
          POSTGRES_DB: mdu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mdu" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      # packages/db integration tests create and drop a throwaway database here.
      TEST_DATABASE_URL: postgres://mdu:mdu@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from packageManager in package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: Migrations match the schema
        run: |
          pnpm db:generate
          git status --porcelain packages/db/migrations
          test -z "$(git status --porcelain packages/db/migrations)"
      - run: pnpm test
      - run: pnpm build

  pipeline:
    name: Pipeline (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    services:
      postgis:
        image: imresamu/postgis:18-3.6 # same image as docker-compose.yml
        env:
          POSTGRES_USER: mdu
          POSTGRES_PASSWORD: mdu
          POSTGRES_DB: mdu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mdu" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      # Stage tests create and drop a throwaway database here (tests/conftest.py).
      TEST_DATABASE_URL: postgres://mdu:mdu@localhost:5432/postgres
      # Raw fixtures live in private R2 (ADR 0004); a missing one fails the run instead of skipping.
      MDU_REQUIRE_FIXTURES: "1"
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3; no moving major tag
        with:
          working-directory: pipeline
          enable-cache: true
      - name: Install Tesseract with Romanian data (ADR 0006)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-ron
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Pull fixtures from R2
        run: |
          for city in tests/fixtures/*/; do
            uv run mdu fixtures pull --city "$(basename "$city")"
          done
      - run: uv run pytest
      - name: Imports work without dev dependencies (as ingest-daily installs)
        run: |
          uv sync --locked --no-dev
          uv run --no-dev python -c "import importlib, pkgutil, mdu; [importlib.import_module(m.name) for m in pkgutil.walk_packages(mdu.__path__, 'mdu.')]"
          uv run --no-dev mdu --version

  migrate:
    name: Migrate database
    # The production database changes only after every check passed (ADR 0003). Vercel's
    # Deployment Checks wait for this job too, so new code goes live after its migration.
    needs: [web, pipeline]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @mdu/db...
      - run: pnpm db:deploy
