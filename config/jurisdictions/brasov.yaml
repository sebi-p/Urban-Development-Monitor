# Jurisdiction config (PLAN §6). Everything city-specific lives here or in pipeline/src/mdu/adapters/brasov/.
slug: brasov
name: Brașov
county: Brașov
country: RO
timezone: Europe/Bucharest
# [min_lon, min_lat, max_lon, max_lat], WGS 84. Municipality area incl. Poiana Brașov.
bbox: [25.52, 45.58, 25.68, 45.70]

config:
  # Never requested: robots.txt disallows crawlers on the permit/certificate register (PLAN §2).
  blocked_hosts:
    - extranet.brasovcity.ro
  # Approximate areas around OpenStreetMap's neighbourhood points until the city's zoning units
  # (UTR) can be imported with `mdu neighbourhoods import` (ADR 0017).
  neighbourhood_source: osm
  neighbourhoods:
    # Places OpenStreetMap has no point for, as {name, lon, lat}; each becomes an approximate area.
    extra: []
    # The name people use, shown next to OpenStreetMap's (slug → name; slugs and links stay).
    names:
      valea-cetatii: "Valea Cetății (Răcădău)"
  # The nightly back-fill runs for this city: the watchdog expects a night until the walk is
  # done, also before its first checkpoint (ADR 0021).
  backfill: true
  legal_regime:
    catuc_from: "2026-08-25" # Law 169/2026; earlier procedures stay pre_catuc
